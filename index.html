<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Зум не блокируется: старый viewport с user-scalable=no
       нарушал WCAG 1.4.4 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ESSCALE — наука, инженерия и разработка для бизнеса</title>
  <meta name="description" content="Разрабатываем ПО для задач, у которых нет готового решения: высоконагруженные системы, мобильные приложения, математические модели и машинное обучение. Прозрачная оценка проекта в Esscale Points.">
  <link rel="canonical" href="https://esscale.ru/">
  <meta name="theme-color" content="#08090B">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ESSCALE">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:url" content="https://esscale.ru/">
  <meta property="og:title" content="ESSCALE — инженерная разработка">
  <meta property="og:description" content="ПО для задач, у которых нет готового решения. Прозрачная оценка проекта в Esscale Points.">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="preload" href="/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>

  <script>
    /* Синхронно и до первой отрисовки: помечаем, что скрипт жив.
       Прелоадер и стартовые состояния анимаций висят на этом
       атрибуте, поэтому без JS они просто не применяются, а не
       остаются навсегда поверх контента. */
    try {
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.dataset.anim = ''
      }
    } catch (e) {}
  </script>

  <script type="module" src="/src/js/main.js"></script>
</head>

<body>
  <canvas class="field" data-field aria-hidden="true"></canvas>

  <div class="loader" data-loader>
    <div class="loader__inner">
      <span class="loader__mark">ESSCALE</span>
      <span class="loader__bar"></span>
      <span class="loader__count" data-loader-count>000</span>
    </div>
  </div>

  <header class="hdr">
    <a class="hdr__mark" href="/">Esscale</a>
    <nav class="hdr__nav">
      <a class="hdr__link" href="#work">Работы</a>
      <a class="hdr__link" data-secondary href="#directions">Направления</a>
      <a class="hdr__link" href="#estimate">Расчёт</a>
      <a class="hdr__link" href="{{TELEGRAM}}" target="_blank" rel="noopener">Telegram</a>
    </nav>
  </header>

  <main>
    <section class="hero container">
      <p class="hero__label t-mono" data-reveal>Наука · Инженерия · Бизнес</p>

      <h1 class="hero__title" data-lines>
        <span class="line"><span class="line__in">От <span class="hero__accent">формулы</span></span></span>
        <span class="line"><span class="line__in">до продакшена</span></span>
      </h1>

      <p class="hero__lede" data-reveal>
        Ваша идея — наша реализация. Берём задачи, у которых нет
        готового решения, и доводим их до работающего продукта.
      </p>

      <div class="readout" data-reveal>
        <div class="readout__item">
          <span class="readout__value">15&nbsp;EP</span>
          <span class="readout__label">скорость команды в неделю</span>
        </div>
        <div class="readout__item">
          <span class="readout__value">297&nbsp;EP</span>
          <span class="readout__label">объём проекта scandere</span>
        </div>
      </div>
    </section>

    <!--SECTIONS-->
</body>
</html>
